# Terms borrowed as a taxonomy seed (method/task hierarchy) for the prefilter.
taxonomy_terms:
  - geometric deep learning
  - conditional generation
  - structured prediction
  - set-to-sequence
  - permutation invariance
  - permutation equivariance
  - copy attention
  - execution feedback
  - reward model
  - policy network

# Light exclusions: kill obvious off-domain noise without harming signal. Kept
# short on purpose — equivariance/GNN terms recur in molecular/physics work that
# can still transfer, so we do not exclude those.
exclude_keywords:
  - recommender system
  - sentiment analysis
  - question answering benchmark
  - clinical
  - electronic health record
  - stock market
  - autonomous driving perception

# --- Providers -------------------------------------------------------------
llm:
  provider: anthropic          # falls back to 'mock' automatically if no API key
  relevance_model: claude-haiku-4-5-20251001
  extraction_model: claude-sonnet-5
  scoring_model: claude-haiku-4-5-20251001
  temperature: 0.0

embedding:
  provider: specter2           # falls back to hashing if torch/transformers absent
  model_name: allenai/specter2_base
  fallback_to_hashing: true
  hashing_dim: 256

sourcing:
  arxiv_categories:
    - cs.LG      # machine learning
    - cs.CV      # vision / geometry
    - cs.CG      # computational geometry
    - cs.GR      # graphics (meshing)
    - cs.AI      # program synthesis / search
  max_results_per_run: 250
  use_semantic_scholar: true
  use_openalex: true
  use_hf_papers: false
  harvest_prefilter: true

relevance:
  embedding_threshold: 0.52
  embedding_shortlist: 60
  llm_threshold: 0.5
  use_bm25_rrf: false

extraction:
  use_grobid: false            # set true when a GROBID service is reachable
  grobid_url: http://localhost:8070
  prefer_html: true            # ar5iv/arXiv HTML avoids PDF-parse errors
  max_chunk_tokens: 1200
  max_chunks: 24
  limitation_section_patterns:
    - limitation
    - failure
    - future work
    - discussion
    - conclusion

scoring:
  weight_impact: 1.0
  weight_applicability: 1.2    # tilt toward methods that transfer to our setup
  weight_confidence: 1.0
  foundational_reserved_slots: 5
  foundational_min_citations: 100
  recent_paper_grace_days: 365
  llm_estimate_effort: true

delivery:
  top_n: 25
  digest_window_days: 7
  output_dir: output
  render_html: true

storage:
  db_path: data/hexgen.db
